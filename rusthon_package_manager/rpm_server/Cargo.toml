[package]
name = "rpm_server"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.21.3"
rand = "0.8"
